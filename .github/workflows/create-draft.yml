name: Create draft

# Monday 10:00 AM Juárez (16:00 UTC): drafts for the week's posts (Tue/Thu/Sat) and their Stories.
# The summary message has a button to approve the whole week; every draft also arrives on its own.
# Manual run: post_date is the first day to cover (empty = tomorrow).
on:
  schedule:
    - cron: '0 16 * * 1'
  workflow_dispatch:
    inputs:
      post_date:
        description: First local date to cover (YYYY-MM-DD). Empty = tomorrow.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: drafts
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate the week
        id: gen
        run: |
          node scripts/generate-draft.mjs --week > ids.txt
          cat ids.txt
          echo "first=$(head -1 ids.txt | cut -c1-10)" >> "$GITHUB_OUTPUT"
        env:
          POST_DATE: ${{ inputs.post_date }}
      - name: Commit drafts
        run: |
          git config user.name "buen-sazon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add drafts
          git commit -m "chore: new drafts for the week of ${{ steps.gen.outputs.first }} [skip ci]"
          git pull --rebase && git push
      - name: Send to Telegram
        run: |
          node scripts/notify.mjs --week "${{ steps.gen.outputs.first }}"
          while read -r id; do node scripts/notify.mjs "$id"; done < ids.txt
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_EXTRA_CHAT_IDS: ${{ vars.TELEGRAM_EXTRA_CHAT_IDS }}
          SITE_URL: https://www.elbuensazonjrz.com
