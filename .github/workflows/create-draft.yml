name: Create draft

# Runs the day before each post (Mon/Wed/Fri -> posts Tue/Thu/Sat at noon, Juárez time),
# so there is time to approve it in Telegram.
on:
  schedule:
    - cron: '0 16 * * 1,3,5'
  workflow_dispatch:
    inputs:
      post_date:
        description: Local date to post (YYYY-MM-DD). Empty = tomorrow.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: drafts
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate draft
        id: gen
        run: echo "id=$(node scripts/generate-draft.mjs)" >> "$GITHUB_OUTPUT"
        env:
          POST_DATE: ${{ inputs.post_date }}
      - name: Commit draft
        run: |
          git config user.name "buen-sazon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add drafts
          git commit -m "chore: new draft ${{ steps.gen.outputs.id }} [skip ci]"
          git pull --rebase && git push
      - name: Send to Telegram
        run: |
          node scripts/notify.mjs "${{ steps.gen.outputs.id }}"
          story="$(echo "${{ steps.gen.outputs.id }}" | cut -c1-10)-story"
          if [ -f "drafts/$story.json" ]; then node scripts/notify.mjs "$story"; fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_EXTRA_CHAT_IDS: ${{ vars.TELEGRAM_EXTRA_CHAT_IDS }}
          SITE_URL: https://www.elbuensazonjrz.com
