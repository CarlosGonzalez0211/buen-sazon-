name: Publish approved

# Sweep from noon Juárez time on (17:00 UTC is 11:00 in summer, so nothing goes out early; the
# sweep keeps running until late evening so a post approved after noon still goes out within 30 min).
# Publishes approved drafts whose scheduled_for has passed; also the retry path if an instant
# "Publish now" failed.
on:
  schedule:
    - cron: '0,30 17-23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drafts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/publish-approved.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_EXTRA_CHAT_IDS: ${{ vars.TELEGRAM_EXTRA_CHAT_IDS }}
          SITE_URL: https://www.elbuensazonjrz.com
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      - name: Commit draft state
        if: always()
        run: |
          git config user.name "buen-sazon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add drafts
          git diff --cached --quiet || (git commit -m "chore: sweep published drafts [skip ci]" && git pull --rebase && git push)
